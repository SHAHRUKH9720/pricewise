<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gradient Background Squircle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  
  <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#bgGrad)" />
  
  <!-- Outer Calculator Frame -->
  <rect x="22" y="18" width="56" height="64" rx="10" fill="none" stroke="#FFFFFF" stroke-width="6" />
  
  <!-- Screen Display -->
  <rect x="30" y="26" width="40" height="16" rx="4" fill="#FFFFFF" />
  <text x="64" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#1D4ED8" text-anchor="end">₹</text>
  
  <!-- Key Grid Dots -->
  <circle cx="36" cy="50" r="4" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
  <circle cx="64" cy="50" r="4" fill="#FFFFFF" />
  
  <circle cx="36" cy="62" r="4" fill="#FFFFFF" />
  <circle cx="50" cy="62" r="4" fill="#FFFFFF" />
  <circle cx="64" cy="62" r="4" fill="#FFFFFF" />
  
  <circle cx="36" cy="72" r="3.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="50" cy="72" r="3.5" fill="#FFFFFF" opacity="0.8" />
  <rect x="60" y="68" width="8" height="8" rx="2" fill="#93C5FD" />
</svg>